name: Multimodal Dataset Curation

on:
  workflow_dispatch:

jobs:
  curate-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. تغییر آی‌پی سرور گیت‌هاب به یک آی‌پی غیردیتاسنتری با WireGuard
      - name: Setup WARP IP Masking (WireGuard)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools resolvconf
          curl -fsSL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o wgcf
          chmod +x wgcf
          ./wgcf register --accept-tos
          ./wgcf generate
          sudo sed -i 's/engage.cloudflareclient.com/162.159.192.1/g' wgcf-profile.conf
          sudo cp wgcf-profile.conf /etc/wireguard/wgcf.conf
          sudo wg-quick up wgcf
          echo "✅ New Public IP:"
          curl -s https://api.ipify.org

      # ۲. آماده‌سازی پایتون (بدون کش جهت جلوگیری از ارور نبود requirements.txt)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ۳. نصب ابزارهای پردازش مدیا و پکیج‌ها
      - name: Install System & Python Tools
        run: |
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install "yt-dlp[default]"

      # ۴. اجرای اسکریپت دانلود و استخراج فریم
      - name: Execute Pipeline
        run: |
          python cloud_downloader.py

      # ۵. ذخیره گزارش‌ها و مانیفست
      - name: Upload Manifest & Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Execution_Logs_and_Manifest
          path: |
            pipeline_execution.log
            pipeline_report.json
            Trade_Dataset_281/dataset_manifest.jsonl
          retention-days: 30

      # ۶. ذخیره آرشیوهای نهایی
      - name: Upload PL1_Strategy ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PL1_Strategy_Dataset
          path: PL1_Strategy_dataset.zip
          retention-days: 14

      - name: Upload PL2_Bullrun ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PL2_Bullrun_Dataset
          path: PL2_Bullrun_dataset.zip
          retention-days: 14

      - name: Upload PL3_Basic ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PL3_Basic_Dataset
          path: PL3_Basic_dataset.zip
          retention-days: 14

      - name: Upload PL4_Intermediate ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PL4_Intermediate_Dataset
          path: PL4_Intermediate_dataset.zip
          retention-days: 14
