name: Parallel Multimodal Dataset Curation

on:
  workflow_dispatch:

jobs:
  curate-category:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false # اگر یک دسته موقتاً خطا داد، دسته‌های دیگر متوقف نشوند
      matrix:
        category: [PL1_Strategy, PL2_Bullrun, PL3_Basic, PL4_Intermediate]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. راه‌اندازی پروکسی وارپ با آی‌پی جدید اختصاصی برای این سرور
      - name: Setup Cloudflare WARP SOCKS5 Proxy
        run: |
          curl -fsSL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o wgcf
          chmod +x wgcf
          ./wgcf register --accept-tos
          ./wgcf generate
          
          curl -fsSL https://github.com/octeep/wireproxy/releases/download/v1.0.9/wireproxy_linux_amd64.tar.gz | tar -xz
          echo -e "\n[Socks5]\nBindAddress = 127.0.0.1:40000" >> wgcf-profile.conf
          sed -i 's/engage.cloudflareclient.com/162.159.192.1/g' wgcf-profile.conf
          
          ./wireproxy -c wgcf-profile.conf &
          sleep 4
          echo "✅ Runner Public SOCKS5 IP:"
          curl -s -x socks5://127.0.0.1:40000 https://api.ipify.org

      # ۲. آماده‌سازی نود و پایتون
      - name: Setup Node.js (for YouTube JS Challenges)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Tools & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install "yt-dlp[default]"

      # ۳. بارگذاری کوکی اختیاری در صورت وجود در سکرت‌ها
      - name: Load Cookies (Optional)
        run: |
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES }}" | base64 -d > cookies.txt
            echo "✅ Loaded YOUTUBE_COOKIES secret"
          fi

      # ۴. اجرای پردازش موازی منحصراً برای همین دسته‌بندی ماتریکس
      - name: Execute Category Pipeline
        run: |
          python cloud_downloader.py --category ${{ matrix.category }}

      # ۵. آپلود آرشیو کامل این دسته‌بندی
      - name: Upload ${{ matrix.category }} ZIP Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.category }}_Dataset
          path: ${{ matrix.category }}_dataset.zip
          retention-days: 14
