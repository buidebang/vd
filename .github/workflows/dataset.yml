name: Multimodal Dataset Curation

on:
  workflow_dispatch:

jobs:
  curate-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. راه‌اندازی پروکسی وارپ
      - name: Setup Cloudflare WARP SOCKS5 Proxy
        run: |
          curl -fsSL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o wgcf
          chmod +x wgcf
          ./wgcf register --accept-tos
          ./wgcf generate
          
          curl -fsSL https://github.com/octeep/wireproxy/releases/download/v1.0.9/wireproxy_linux_amd64.tar.gz | tar -xz
          echo -e "\n[Socks5]\nBindAddress = 127.0.0.1:40000" >> wgcf-profile.conf
          sed -i 's/engage.cloudflareclient.com/162.159.192.1/g' wgcf-profile.conf
          
          ./wireproxy -c wgcf-profile.conf &
          sleep 4
          echo "✅ WARP SOCKS5 Proxy IP:"
          curl -s -x socks5://127.0.0.1:40000 https://api.ipify.org

      # ۲. فعال‌سازی نود برای حل چالش‌های جاوااسکریپت یوتیوب (طبق ریپوی ارسالی)
      - name: Setup Node.js (for YouTube JS challenges)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install "yt-dlp[default]"

      # ۳. باز کردن کوکی در صورت وجود سکرت YOUTUBE_COOKIES در ریپازیتوری
      - name: Setup Cookies (Optional)
        run: |
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES }}" | base64 -d > cookies.txt
            echo "✅ Loaded YOUTUBE_COOKIES secret into cookies.txt"
          fi

      # ۴. اجرای پایپ‌لاین
      - name: Execute Pipeline
        run: |
          python cloud_downloader.py

      # ۵. ذخیره فایل‌های خروجی
      - name: Upload Manifest & Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Execution_Logs_and_Manifest
          path: |
            pipeline_execution.log
            pipeline_report.json
            Trade_Dataset_281/dataset_manifest.jsonl
          retention-days: 30

      - name: Upload PL1_Strategy ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PL1_Strategy_Dataset
          path: PL1_Strategy_dataset.zip
          retention-days: 14

      - name: Upload PL2_Bullrun ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PL2_Bullrun_Dataset
          path: PL2_Bullrun_dataset.zip
          retention-days: 14

      - name: Upload PL3_Basic ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PL3_Basic_Dataset
          path: PL3_Basic_dataset.zip
          retention-days: 14

      - name: Upload PL4_Intermediate ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PL4_Intermediate_Dataset
          path: PL4_Intermediate_dataset.zip
          retention-days: 14
