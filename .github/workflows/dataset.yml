name: Multimodal Dataset Curation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Cloudflare WARP & Wireproxy
        run: |
          curl -fsSL https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -o wgcf
          chmod +x wgcf
          ./wgcf register --accept-tos
          ./wgcf generate
          
          curl -fsSL https://github.com/octeep/wireproxy/releases/download/v1.0.9/wireproxy_linux_amd64.tar.gz | tar -xz
          echo -e "\n[Socks5]\nBindAddress = 127.0.0.1:40000" >> wgcf-profile.conf
          sed -i 's/engage.cloudflareclient.com/162.159.192.1/g' wgcf-profile.conf
          
          ./wireproxy -c wgcf-profile.conf &
          sleep 4
          echo "Initial IP:"
          curl -s -x socks5://127.0.0.1:40000 https://api.ipify.org

      - name: Setup Node.js (for YouTube JS challenges)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Tools & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install "yt-dlp[default]"

      - name: Load Cookies (Optional)
        run: |
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES }}" | base64 -d > cookies.txt
            echo "Loaded cookies."
          fi

      - name: Run Pipeline
        run: |
          python cloud_downloader.py

      - name: Commit Manifest to Main Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Trade_Dataset_281/dataset_manifest.jsonl pipeline_execution.log || true
          git commit -m "Auto-update: Verified Dataset Manifest [skip ci]" || echo "No changes"
          git push origin main || echo "Git push skipped"

      - name: Create GitHub Release with Dataset ZIPs
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: dataset-v1.0-${{ github.run_number }}
          name: "Trading Dataset 281 (>=95% Verified)"
          draft: false
          prerelease: false
          files: |
            PL1_Strategy_dataset.zip
            PL2_Bullrun_dataset.zip
            PL3_Basic_dataset.zip
            PL4_Intermediate_dataset.zip
            Trade_Dataset_281/dataset_manifest.jsonl
            pipeline_execution.log
